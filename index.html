<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Activities Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0d0d">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
    <div class="container">
        <h1>Daily Activities Tracker</h1>

        <div class="calendar-container">
            <!-- Year & Month Selector -->
            <div class="selector-container">
                <select id="year-select" onchange="generateCalendar()"></select>
                <select id="month-select" onchange="generateCalendar()">
                    <option value="0">January</option>
                    <option value="1">February</option>
                    <option value="2">March</option>
                    <option value="3">April</option>
                    <option value="4">May</option>
                    <option value="5">June</option>
                    <option value="6">July</option>
                    <option value="7">August</option>
                    <option value="8">September</option>
                    <option value="9">October</option>
                    <option value="10">November</option>
                    <option value="11">December</option>
                </select>
            </div>

            <div class="calendar" id="calendar"></div>
        </div>

        <!-- Editable Title -->
        <div id="selected-date">
            <input type="text" id="date-title" placeholder="Add a title for this day" oninput="saveTitle()">
        </div>

        <div id="activity-list"></div>

        <div class="input-container" id="input-container">
            <input type="text" id="activity-description" placeholder="Enter activity description">
            <button onclick="addActivity()">Add</button>
        </div>

        <div class="button-container">
            <div class="btn" onclick="showInput()">+ Add Activity</div>
            <button class="btn" onclick="resetProgress()">Reset All</button>
            <button class="btn" onclick="clearActivities()">Clear Day</button>
            <button class="btn" onclick="goToToday()">Today</button>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
